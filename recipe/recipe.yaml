schema_version: 1

context:
  version: "0.11.5"

package:
  name: fps-contents
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/fps-contents/fps_contents-${{ version }}.tar.gz
    sha256: e673266cf31bb04b05cc85b972928f94f63947b187f983983584a9e4cae0af61

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.32,<0.12
  run:
    - python >=${{ python_min }}
    - anyio
    - fastapi-core
    - fps
    - jupyverse-api >=0.15.0,<0.16.0
    - jupyverse-auth >=0.2.0,<0.3.0
    - jupyverse-contents >=0.1.3,<0.2.0
    - starlette
    - structlog

tests:
  - python:
      imports: fps_contents
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/plugins/contents
  summary: An FPS plugin for the contents API.

extra:
  recipe-maintainers:
    - davidbrochart
