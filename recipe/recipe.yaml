schema_version: 1

context:
  version: "0.11.6"

package:
  name: fps-contents
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/fps-contents/fps_contents-${{ version }}.tar.gz
    sha256: b3a5c93e817103d19b05fe874b710434d545f5ebb34ab58f34fe466eb1aaca72

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.32,<0.12
  run:
    - python >=${{ python_min }}
    - anyio
    - fastapi-core
    - fps
    - jupyverse-api >=0.15.0,<0.16.0
    - jupyverse-auth >=0.2.0,<0.3.0
    - jupyverse-contents >=0.1.5,<0.2.0
    - starlette
    - structlog

tests:
  - python:
      imports: fps_contents
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/plugins/contents
  summary: An FPS plugin for the contents API.

extra:
  recipe-maintainers:
    - davidbrochart
